# Study Buddy - Streamlit Theme Settings
#
# This file controls how the app LOOKS (colors, font) without writing any CSS.
# Streamlit reads this file automatically when the app starts.

[theme]
# Main accent color - vibrant indigo-purple for buttons, links, highlights
primaryColor = "#667eea"

# Background color of the main content area
backgroundColor = "#FAFBFF"

# Background color of the sidebar and input boxes
secondaryBackgroundColor = "#EEF2FF"

# Color of normal text
textColor = "#1e1b4b"

# Font style for the whole app
font = "sans serif"
